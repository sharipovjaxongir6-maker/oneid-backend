<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Business Radar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 26px 32px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 7px 0 0;
      opacity: 0.85;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar input {
      flex: 1;
      min-width: 260px;
      padding: 13px 15px;
      border: 1px solid #ccd3dc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .toolbar input:focus {
      border-color: #172033;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 9px;
      background: #172033;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      margin: 12px 0 18px;
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .summary {
      padding: 18px 20px;
      border-bottom: 1px solid #eceff3;
      font-weight: 700;
      font-size: 16px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1000px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 15px;
      border-bottom: 1px solid #eceff3;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      background: #f8f9fb;
      font-weight: 700;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: #fafbfc;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #e8f1ff;
      color: #2457b8;
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      header {
        padding: 22px 18px;
      }

      header h1 {
        font-size: 26px;
      }

      main {
        padding: 20px 12px;
      }

      .toolbar {
        flex-direction: column;
      }

      .toolbar input,
      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>AI Business Radar</h1>
    <p>Yangi ro‘yxatdan o‘tgan bizneslarni kuzatish tizimi</p>
  </header>

  <main>

    <div class="toolbar">
      <input
        id="search"
        type="text"
        placeholder="STIR, nomi, hudud yoki faoliyat bo‘yicha qidirish..."
      >

      <button id="refreshButton" type="button">
        Yangilash
      </button>

      <button id="exportButton" type="button">
        CSV yuklash
      </button>
    </div>

    <div id="status" class="status">
      Ma’lumotlar yuklanmoqda...
    </div>

    <div class="card">

      <div class="summary">
        Topilgan bizneslar:
        <span id="count">0</span>
      </div>

      <div class="table-wrap">
        <table>

          <thead>
            <tr>
              <th>STIR</th>
              <th>Nomi</th>
              <th>Turi</th>
              <th>Hudud</th>
              <th>Tuman</th>
              <th>Faoliyat</th>
              <th>Telefon</th>
              <th>Ro‘yxatdan o‘tgan sana</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="businessTable"></tbody>

        </table>
      </div>

    </div>

  </main>

  <script>
    let businesses = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .
        replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHtml(value);
      }

      return date.toLocaleString("uz-UZ");
    }

    function render(items) {
      const table = document.getElementById("businessTable");
      const count = document.getElementById("count");

      count.textContent = items.length;

      if (items.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="9" class="empty">
              Ma’lumot topilmadi
            </td>
          </tr>
        `;

        return;
      }

      table.innerHTML = items.map((business) => {
        return `
          <tr>
            <td>${escapeHtml(business.tax_id)}</td>
            <td><strong>${escapeHtml(business.name)}</strong></td>
            <td>${escapeHtml(business.entity_type)}</td>
            <td>${escapeHtml(business.region)}</td>
            <td>${escapeHtml(business.district)}</td>
            <td>${escapeHtml(business.activity)}</td>
            <td>${escapeHtml(business.phone)}</td>
            <td>${formatDate(business.registered_at)}</td>
            <td>
              <span class="badge">Yangi</span>
            </td>
          </tr>
        `;
      }).join("");
    }

    async function loadBusinesses() {
      const status = document.getElementById("status");

      status.textContent = "Ma’lumotlar yuklanmoqda...";

      try {
        const response = await fetch("/api/businesses", {
          method: "GET",
          headers: {
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "Server HTTP xatosi: " + response.status
          );
        }

        const data = await response.json();

        businesses = Array.isArray(data.businesses)
          ? data.businesses
          : [];

        render(businesses);

        status.textContent =
          "Server bilan aloqa muvaffaqiyatli.";
      } catch (error) {
        console.error(error);

        businesses = [];
        render([]);

        status.textContent =
          "Ma’lumotlarni yuklashda xatolik yuz berdi.";
      }
    }

    function filterBusinesses() {
      const searchInput =
        document.getElementById("search");

      const query =
        searchInput.value
          .toLowerCase()
          .trim();

      if (!query) {
        render(businesses);
        return;
      }

      const filtered = businesses.filter((business) => {
        const searchableText = [
          business.tax_id,
          business.name,
          business.entity_type,
          business.region,
          business.district,
          business.activity,
          business.phone,
          business.registered_at,
          business.source
        ]
          .map((value) =>
            String(value ?? "").toLowerCase()
          )
          .join(" ");

        return searchableText.includes(query);
      });

      render(filtered);
    }

    function exportCSV() {
      if (businesses.length === 0) {
        alert("Yuklash uchun ma’lumot yo‘q.");
        return;
      }

      const header = [
        "STIR",
        "Nomi",
        "Turi",
        "Hudud",
        "Tuman",
        "Faoliyat",
        "Telefon",
        "Ro'yxatdan o'tgan sana",
        "Manba"
      ];

      const rows = businesses.map((business) => [
        business.tax_id,
        business.name,
        business.entity_type,
        business.region,
        business.district,
        business.activity,
        business.phone,
        business.registered_at,
        business.source
      ]);

      const csvRows = [header, ...rows];

      const csv = csvRows
        .map((row) => {
          return row.map((value) => {
            const safeValue =
              String(value ?? "")
                .replaceAll('"', '""');
            return "${safeValue}";
          }).join(",");
        })
        .join("\r\n");

      const bom = "\uFEFF";

      const blob = new Blob(
        [bom + csv],
        {
          type: "text/csv;charset=utf-8;"
        }
      );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;
      link.download =
        "business-radar.csv";

      document.body.appendChild(link);

      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }

    document
      .getElementById("search")
      .addEventListener(
        "input",
        filterBusinesses
      );

    document
      .getElementById("refreshButton")
      .addEventListener(
        "click",
        loadBusinesses
      );

    document
      .getElementById("exportButton")
      .addEventListener(
        "click",
        exportCSV
      );

    loadBusinesses();
  </script>

</body>
</html>
